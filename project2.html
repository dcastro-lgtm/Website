
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas 3D Rubik's Cube (Drag to Rotate / Turn)</title>
  <style>
    html, body { height: 100%; margin: 0; background:#0f1220; color:#e9eef8; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
    #wrap { display:flex; flex-direction:column; align-items:center; gap:.75rem; padding: .75rem; height: 100%; box-sizing: border-box; }
    canvas { background: radial-gradient(1200px 800px at 60% 10%, #1a2040 0%, #0f1220 60%); box-shadow: 0 10px 50px rgba(0,0,0,.35) inset; border-radius: 12px; }
    .row { width: min(1100px, 95vw); display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: .75rem; }
    .hint { opacity:.8; font-size:.95rem; }
    .btns { display:flex; gap:.5rem; }
    button { background:#1f2a52; border:1px solid #34417a; color:#e9eef8; padding:.5rem .75rem; border-radius:8px; cursor:pointer; }
    button:hover { background:#253067; }
    a.small { color:#9fb3ff; text-decoration:none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="row">
      <div class="hint">
        <strong>Controls:</strong>
        Hover to highlight a sticker. <strong>Drag on a sticker</strong> to slide a layer (arrow appears when the move is valid). <strong>Drag outside</strong> the cube to rotate the view. 
      </div>
      <div class="btns">
        <button id="scramble">Scramble</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    <canvas id="cube" width="1000" height="700" aria-label="Rubik's Cube Canvas"></canvas>
    <div class="row">
      <div class="hint">Tip: Use mouse wheel to zoom. Back-facing stickers are culled for performance and realism.</div>
      <div class="hint"><a class="small" href="https://en.wikipedia.org/wiki/Rubik%27s_Cube" target="_blank" rel="noreferrer noopener">What is a Rubik's Cube?</a></div>
    </div>
  </div>

<script>
(() => {
  /*** -------------------------------
   *  3D Math Utilities (no deps)
   *  ------------------------------- ***/
  const Vec = {
    add: (a,b)=>[a[0]+b[0], a[1]+b[1], a[2]+b[2]],
    sub: (a,b)=>[a[0]-b[0], a[1]-b[1], a[2]-b[2]],
    dot: (a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
    cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
    scale:(a,s)=>[a[0]*s, a[1]*s, a[2]*s],
    len:(a)=>Math.hypot(a[0],a[1],a[2]),
    norm:(a)=>{ const l=Vec.len(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; },
  };

  const Mat = {
    mulVec: (m,v)=>[
      m[0]*v[0]+m[1]*v[1]+m[2]*v[2],
      m[3]*v[0]+m[4]*v[1]+m[5]*v[2],
      m[6]*v[0]+m[7]*v[1]+m[8]*v[2]
    ],
    rotX: (a)=>{ const c=Math.cos(a), s=Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; },
    rotY: (a)=>{ const c=Math.cos(a), s=Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; },
    rotZ: (a)=>{ const c=Math.cos(a), s=Math.sin(a); return [c,-s,0, s,c,0, 0,0,1]; },
    mul: (A,B)=>{
      // 3x3 * 3x3 (row-major), returns A*B
      const r=new Array(9);
      r[0]=A[0]*B[0]+A[1]*B[3]+A[2]*B[6];
      r[1]=A[0]*B[1]+A[1]*B[4]+A[2]*B[7];
      r[2]=A[0]*B[2]+A[1]*B[5]+A[2]*B[8];
      r[3]=A[3]*B[0]+A[4]*B[3]+A[5]*B[6];
      r[4]=A[3]*B[1]+A[4]*B[4]+A[5]*B[7];
      r[5]=A[3]*B[2]+A[4]*B[5]+A[5]*B[8];
      r[6]=A[6]*B[0]+A[7]*B[3]+A[8]*B[6];
      r[7]=A[6]*B[1]+A[7]*B[4]+A[8]*B[7];
      r[8]=A[6]*B[2]+A[7]*B[5]+A[8]*B[8];
      return r;
    },
  };

  /*** -------------------------------
   *  Cube Data Structures
   *  ------------------------------- ***/
  const FACE = { U:'U', D:'D', F:'F', B:'B', R:'R', L:'L' };
  const FACE_ORDER = ['U','D','F','B','R','L'];
  const FACE_COLOR = { // classic-ish color scheme
    U:'#ffffff', D:'#ffd500', F:'#009b48', B:'#0046ad', R:'#b71234', L:'#ff5800'
  };

  // Face normals in cube coordinates
  const FACE_NORMAL = {
    U:[0,1,0], D:[0,-1,0], F:[0,0,1], B:[0,0,-1], R:[1,0,0], L:[-1,0,0]
  };
  // For each face, define local u (right) and v (up) axes in world cube space
  const FACE_UV = {
    F: {u:[1,0,0], v:[0,1,0]},
    B: {u:[-1,0,0], v:[0,1,0]},
    U: {u:[1,0,0], v:[0,0,-1]},
    D: {u:[1,0,0], v:[0,0, 1]},
    R: {u:[0,0,-1], v:[0,1,0]},
    L: {u:[0,0, 1], v:[0,1,0]},
  };

  // Cubie structure: at grid (x,y,z) in {0,1,2}, stickers is map face->color
  const mkSolvedCubies = () => {
    const cubies = [...Array(3)].map(()=>[...Array(3)].map(()=>[...Array(3)]));
    for (let x=0;x<3;x++) for (let y=0;y<3;y++) for (let z=0;z<3;z++) {
      const stickers = {};
      if (y===2) stickers[FACE.U] = FACE_COLOR.U;
      if (y===0) stickers[FACE.D] = FACE_COLOR.D;
      if (z===2) stickers[FACE.F] = FACE_COLOR.F;
      if (z===0) stickers[FACE.B] = FACE_COLOR.B;
      if (x===2) stickers[FACE.R] = FACE_COLOR.R;
      if (x===0) stickers[FACE.L] = FACE_COLOR.L;
      cubies[x][y][z] = { x, y, z, stickers };
    }
    return cubies;
  };

  // Rotation helpers for cubie stickers
  const ROT_MAP = {
    x: {
      '+': { U:'F', F:'D', D:'B', B:'U', R:'R', L:'L' },
      '-': { U:'B', B:'D', D:'F', F:'U', R:'R', L:'L' },
    },
    y: {
      '+': { F:'L', L:'B', B:'R', R:'F', U:'U', D:'D' },
      '-': { F:'R', R:'B', B:'L', L:'F', U:'U', D:'D' },
    },
    z: {
      '+': { R:'U', U:'L', L:'D', D:'R', F:'F', B:'B' },
      '-': { R:'D', D:'L', L:'U', U:'R', F:'F', B:'B' },
    }
  };

  function rotateLayer(cubies, axis, layerIndex, dir) {
    const s = dir > 0 ? '+' : '-';

    // Move positions
    const next = [...Array(3)].map(()=>[...Array(3)].map(()=>[...Array(3)]));
    for (let x=0;x<3;x++) for (let y=0;y<3;y++) for (let z=0;z<3;z++) {
      const c = cubies[x][y][z];
      let nx=x, ny=y, nz=z;
      const inLayer = (axis==='x'? x===layerIndex : axis==='y'? y===layerIndex : z===layerIndex);
      if (inLayer) {
        if (axis==='x') {
          if (dir>0) { ny = 2 - z; nz = y; } else { ny = z; nz = 2 - y; }
        } else if (axis==='y') {
          if (dir>0) { nx = z; nz = 2 - x; } else { nx = 2 - z; nz = x; }
        } else if (axis==='z') {
          if (dir>0) { nx = 2 - y; ny = x; } else { nx = y; ny = 2 - x; }
        }
      }
      next[nx][ny][nz] = { x:nx, y:ny, z:nz, stickers: {...c.stickers} };
    }

    // Rotate stickers for affected cubies
    for (let x=0;x<3;x++) for (let y=0;y<3;y++) for (let z=0;z<3;z++) {
      const c = next[x][y][z];
      const wasInLayer = (axis==='x'? x===layerIndex : axis==='y'? y===layerIndex : z===layerIndex);
      if (!wasInLayer) continue;
      const map = ROT_MAP[axis][s];
      const newStickers = {};
      for (const [face, col] of Object.entries(c.stickers)) {
        const newFace = map[face] || face; // rotate if mapped
        newStickers[newFace] = col;
      }
      c.stickers = newStickers;
    }

    return next;
  }

  /*** -------------------------------
   *  Rendering, Projection & Picking
   *  ------------------------------- ***/
  const canvas = document.getElementById('cube');
  const ctx = canvas.getContext('2d');

  let W = canvas.width, H = canvas.height;
  const center = ()=>[W/2, H/2];

  // Camera / view params
  let yaw = -0.9, pitch = -0.3; // radians
  let zoom = 750;               // perspective scale
  const camDist = 5.0;          // add to z to keep points in front of camera

  // Interaction state
  let cubies = mkSolvedCubies();
  let projectedStickers = [];   // filled each frame with projected geometry for picking
  let hoverSticker = null;      // {face, x,y,z, poly:[p0..p3], center2D, normalCam, ...}

  let draggingView = false;
  let draggingSticker = null;   // the sticker object where drag started
  let dragStart = null;         // {x,y}
  let candidateMove = null;     // {axis, layerIndex, dir, arrowFrom:[x,y], arrowTo:[x,y]}

  // Geometry constants
  const half = 1.0;             // cube half-size along each axis (we use -1..1)
  const band = (2*half)/3;      // size per cubie along an axis
  const gap = 0.06;             // visual gap between stickers
  const stickerHalf = band/2 - gap; // half size of sticker square within a cell

  // Project 3D to 2D
  function getViewMatrix() {
    // R = R_yaw * R_pitch
    return Mat.mul(Mat.rotY(yaw), Mat.rotX(pitch));
  }

  function projectPoint(p3) {
    const R = getViewMatrix();
    const v = Mat.mulVec(R, p3);
    const z = v[2] + camDist;
    const s = zoom / z;
    return [ W/2 + v[0]*s, H/2 - v[1]*s, z, v ]; // return also z and camera-space vector
  }

  function faceBasisWorld(face) {
    const n = FACE_NORMAL[face];
    const u = FACE_UV[face].u;
    const v = FACE_UV[face].v;
    return {n,u,v};
  }

  function worldPosForIndex(idx) {
    // map 0,1,2 -> +1, 0, -1 along axis Y top->bottom etc.
    return idx===0 ? +half : idx===1 ? 0 : -half;
  }

  function buildProjectedStickers() {
    const R = getViewMatrix();
    const list = [];

    for (let x=0;x<3;x++) for (let y=0;y<3;y++) for (let z=0;z<3;z++) {
      const c = cubies[x][y][z];
      const cx = worldPosForIndex(x);
      const cy = worldPosForIndex(y);
      const cz = worldPosForIndex(z);

      for (const face of Object.keys(c.stickers)) {
        // Only outer faces produce stickers
        const {n,u,v} = faceBasisWorld(face);
        // world-space face center: position of the cubie with half-size offset along normal
        const center3 = [
          cx + n[0]*(half - 0.0001),
          cy + n[1]*(half - 0.0001),
          cz + n[2]*(half - 0.0001),
        ];
        // Build 4 corners using tangent axes u & v
        const su = Vec.scale(u, stickerHalf);
        const sv = Vec.scale(v, stickerHalf);
        // corners in order (CCW around +n when seen from outside)
        const corners = [
          Vec.add( Vec.add(center3, Vec.scale(su, -1)), Vec.scale(sv, -1) ), // bottom-left
          Vec.add( Vec.add(center3, Vec.scale(su, +1)), Vec.scale(sv, -1) ), // bottom-right
          Vec.add( Vec.add(center3, Vec.scale(su, +1)), Vec.scale(sv, +1) ), // top-right
          Vec.add( Vec.add(center3, Vec.scale(su, -1)), Vec.scale(sv, +1) ), // top-left
        ];

        // Transform normal to camera space for back-face culling
        const nCam = Mat.mulVec(R, n);
        const facing = nCam[2] > 0; // camera looks towards +Z (after adding camDist), so front-facing if z-component positive
        if (!facing) continue; // don't render/pick back-facing stickers

        const proj = corners.map(projectPoint);
        const poly2 = proj.map(p=>[p[0], p[1]]);
        const center2D = projectPoint(center3);

        list.push({
          face, color: c.stickers[face], x, y, z,
          center3, corners3: corners, poly2, center2: [center2D[0], center2D[1]],
          normalCam: nCam,
          // also store projected face local axes u,v for UI arrows
          uProj: (function(){ const up = projectPoint(Vec.add(center3, u)); return Vec.norm([up[0]-center2D[0], up[1]-center2D[1], 0]).slice(0,2); })(),
          vProj: (function(){ const vp = projectPoint(Vec.add(center3, v)); return Vec.norm([vp[0]-center2D[0], vp[1]-center2D[1], 0]).slice(0,2); })(),
          uWorld: u, vWorld: v, nWorld: n,
        });
      }
    }

    // Depth sort painter's algorithm (far to near)
    list.sort((a,b)=>{
      // average depth from camera (bigger z is farther due to cam looking +Z)
      const az = projectPoint(a.center3)[2];
      const bz = projectPoint(b.center3)[2];
      return bz - az; // far first
    });
    return list;
  }

  function pointInPoly2D(pt, poly) {
    // Convex quad winding test using cross products (pt inside if consistent sign)
    const [px,py] = pt;
    let sign = 0;
    for (let i=0;i<poly.length;i++) {
      const [x1,y1] = poly[i];
      const [x2,y2] = poly[(i+1)%poly.length];
      const dx1 = x2 - x1, dy1 = y2 - y1;
      const dx2 = px - x1, dy2 = py - y1;
      const cross = dx1*dy2 - dy1*dx2; // z-component of cross product
      if (cross !== 0) {
        const s = Math.sign(cross);
        if (sign === 0) sign = s; else if (s !== sign) return false;
      }
    }
    return true;
  }

  function hitTestSticker(mx,my) {
    // pick nearest (last rendered) sticker whose poly contains point
    for (let i=projectedStickers.length-1; i>=0; i--) {
      const s = projectedStickers[i];
      if (pointInPoly2D([mx,my], s.poly2)) return s;
    }
    return null;
  }

  /*** -------------------------------
   *  UI Move Deduction from Drag
   *  ------------------------------- ***/
  function deduceMoveFromDrag(startSticker, startPt, curPt) {
    if (!startSticker) return null;
    const d = [curPt.x - startPt.x, curPt.y - startPt.y];
    const du = startSticker.uProj; // 2D vectors unit-ish
    const dv = startSticker.vProj;
    // Alignment with du or dv
    const duLen = Math.hypot(du[0],du[1]) || 1;
    const dvLen = Math.hypot(dv[0],dv[1]) || 1;
    const dLen = Math.hypot(d[0],d[1]) || 0.00001;
    const uDot = (d[0]*du[0] + d[1]*du[1])/(duLen*dLen);
    const vDot = (d[0]*dv[0] + d[1]*dv[1])/(dvLen*dLen);
    const absU = Math.abs(uDot), absV = Math.abs(vDot);

    const threshold = 0.35; // directional alignment
    const distThreshold = 12; // pixels before we consider a move
    if (dLen < distThreshold) return null;

    let useU = false, sign = 0;
    if (absU > absV && absU >= threshold) { useU = true; sign = Math.sign(uDot); }
    else if (absV >= threshold) { useU = false; sign = Math.sign(vDot); }
    else return null;

    // Rotation axis is perpendicular to drag within the face plane: drag along u => rotate about v; drag along v => rotate about u.
    const rotAxisWorld = useU ? startSticker.vWorld : startSticker.uWorld; // one of basis +-X/Y/Z

    // Determine which global axis label and layer index
    let axisLabel = 'x', layerIndex = 0; // default
    if (Math.abs(rotAxisWorld[0])>0) { axisLabel = 'x'; layerIndex = startSticker.x; }
    else if (Math.abs(rotAxisWorld[1])>0) { axisLabel = 'y'; layerIndex = startSticker.y; }
    else { axisLabel = 'z'; layerIndex = startSticker.z; }

    // Decide rotation direction (+/- 90°) by testing which sign moves the start sticker center along drag direction after projection
    const testDir = (dir)=>{
      // Take the 3D center of the sticker's cubie; rotate it a tiny 90° around axis on that layer and project
      const {x,y,z} = startSticker;
      let nx=x, ny=y, nz=z;
      if (axisLabel==='x' && x===layerIndex) {
        if (dir>0) { ny = 2 - z; nz = y; } else { ny = z; nz = 2 - y; }
      } else if (axisLabel==='y' && y===layerIndex) {
        if (dir>0) { nx = z; nz = 2 - x; } else { nx = 2 - z; nz = x; }
      } else if (axisLabel==='z' && z===layerIndex) {
        if (dir>0) { nx = 2 - y; ny = x; } else { nx = y; ny = 2 - x; }
      }
      const c0 = startSticker.center2;
      const c1 = projectPoint([worldPosForIndex(nx), worldPosForIndex(ny), worldPosForIndex(nz)]);
      const delta = [c1[0]-c0[0], c1[1]-c0[1]];
      const align = (delta[0]*d[0] + delta[1]*d[1]) / ((Math.hypot(...delta)||1) * dLen);
      return align; // cosine of alignment with drag
    };

    const alignPlus = testDir(+1);
    const alignMinus = testDir(-1);
    const chosenDir = (alignPlus >= alignMinus) ? +1 : -1;

    // Arrow endpoints (render in 2D from sticker center along chosen face axis that drags)
    const axis2D = useU ? du : dv; // direction of drag in 2D
    const arrowLen = Math.min(60, 20 + dLen*0.6);
    const from = startSticker.center2;
    const to = [ from[0] + axis2D[0]*arrowLen*Math.sign(useU?uDot:vDot), from[1] + axis2D[1]*arrowLen*Math.sign(useU?uDot:vDot) ];

    return { axis: axisLabel, layerIndex, dir: chosenDir, arrowFrom: from, arrowTo: to, kind: useU?'u':'v' };
  }

  /*** -------------------------------
   *  Rendering
   *  ------------------------------- ***/
  function drawScene() {
    ctx.clearRect(0,0,W,H);

    // build sticker geometry and perform back-face culling
    projectedStickers = buildProjectedStickers();

    // draw stickers (far to near)
    for (const s of projectedStickers) {
      // fill
      ctx.beginPath();
      const poly = s.poly2;
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0], poly[i][1]);
      ctx.closePath();

      // subtle lighting with normal z
      const light = Math.min(1.2, 0.7 + 0.3*(s.normalCam[2]));
      ctx.fillStyle = shadeColor(s.color, light);
      ctx.fill();

      // border / grid
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#0d0d12';
      ctx.stroke();
    }

    // hover highlight (draw on top)
    if (hoverSticker) {
      drawStickerHighlight(hoverSticker, draggingSticker ? '#ffe98a' : '#a5c9ff');
    }

    // Arrow for candidate move while dragging
    if (candidateMove && draggingSticker) {
      drawArrow(candidateMove.arrowFrom, candidateMove.arrowTo);
    }
  }

  function drawStickerHighlight(s, color) {
    ctx.beginPath();
    const poly = s.poly2;
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath();
    ctx.lineWidth = 4;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawArrow(from, to) {
    const [x1,y1] = from, [x2,y2] = to;
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy) || 1;
    const nx = dx/len, ny = dy/len;
    const head = 12;

    // shaft
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#ffe98a';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // head (triangle)
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - nx*head - ny*head*0.6, y2 - ny*head + nx*head*0.6);
    ctx.lineTo(x2 - nx*head + ny*head*0.6, y2 - ny*head - nx*head*0.6);
    ctx.closePath();
    ctx.fill();
  }

  function shadeColor(hex, factor) {
    // hex #rrggbb; factor >1 brighten, <1 darken
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const rr = Math.max(0, Math.min(255, Math.round(r*factor)));
    const gg = Math.max(0, Math.min(255, Math.round(g*factor)));
    const bb = Math.max(0, Math.min(255, Math.round(b*factor)));
    return `rgb(${rr},${gg},${bb})`;
  }

  /*** -------------------------------
   *  Interaction Handlers
   *  ------------------------------- ***/
  function onResize() {
    const ratio = window.devicePixelRatio || 1;
    const w = Math.min(1100, Math.max(700, window.innerWidth*0.95));
    const h = Math.min(800, Math.max(520, window.innerHeight*0.75));
    canvas.width = Math.round(w*ratio);
    canvas.height = Math.round(h*ratio);
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    W = canvas.width; H = canvas.height;
    drawScene();
  }

  window.addEventListener('resize', onResize);

  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width/rect.width);
    const my = (e.clientY - rect.top) * (canvas.height/rect.height);

    if (draggingView && dragStart) {
      const dx = mx - dragStart.x, dy = my - dragStart.y;
      yaw += dx * 0.004;
      pitch += dy * 0.004;
      pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, pitch));
      dragStart = {x:mx, y:my};
    } else if (draggingSticker && dragStart) {
      // keep original sticker highlighted
      hoverSticker = draggingSticker;
      candidateMove = deduceMoveFromDrag(draggingSticker, dragStart, {x:mx, y:my});

      // Additional validity check: mouse should be hovering a sticker in the same layer as the candidate move
      if (candidateMove) {
        const hs = hitTestSticker(mx,my);
        if (hs) {
          const {axis, layerIndex} = candidateMove;
          const sameLayer = (axis==='x'? hs.x===layerIndex : axis==='y'? hs.y===layerIndex : hs.z===layerIndex);
          if (!sameLayer) candidateMove = null; // invalidate arrow if not same slice
        } else {
          candidateMove = null;
        }
      }
    } else {
      // hover logic when idle
      projectedStickers = buildProjectedStickers();
      hoverSticker = hitTestSticker(mx,my);
    }

    drawScene();
  });

  canvas.addEventListener('mousedown', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width/rect.width);
    const my = (e.clientY - rect.top) * (canvas.height/rect.height);

    projectedStickers = buildProjectedStickers();
    const hit = hitTestSticker(mx,my);
    if (hit) {
      draggingSticker = hit;
      hoverSticker = hit; // lock highlight on this sticker while dragging
      dragStart = {x:mx, y:my};
      candidateMove = null;
    } else {
      draggingView = true;
      dragStart = {x:mx, y:my};
    }
    drawScene();
  });

  canvas.addEventListener('mouseup', ()=>{
    // commit move if valid
    if (candidateMove) {
      cubies = rotateLayer(cubies, candidateMove.axis, candidateMove.layerIndex, candidateMove.dir);
    }
    draggingView = false;
    draggingSticker = null;
    dragStart = null;
    candidateMove = null;
    drawScene();
  });

  canvas.addEventListener('mouseleave', ()=>{
    draggingView = false;
    draggingSticker = null;
    dragStart = null;
    candidateMove = null;
    hoverSticker = null;
    drawScene();
  });

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = Math.sign(e.deltaY);
    zoom *= (delta>0 ? 0.92 : 1.08);
    zoom = Math.max(350, Math.min(1600, zoom));
    drawScene();
  }, {passive:false});

  // Buttons
  document.getElementById('reset').addEventListener('click', ()=>{
    cubies = mkSolvedCubies();
    drawScene();
  });

  document.getElementById('scramble').addEventListener('click', ()=>{
    // Perform N random valid layer turns
    const axes = ['x','y','z'];
    let last = null;
    for (let i=0;i<32;i++) {
      let axis = axes[Math.floor(Math.random()*3)];
      if (last && Math.random()<0.4) axis = last; // some chance to repeat axis
      const layerIndex = Math.floor(Math.random()*3);
      const dir = Math.random()<0.5? +1 : -1;
      cubies = rotateLayer(cubies, axis, layerIndex, dir);
      last = axis;
    }
    drawScene();
  });

  // Initial render
  onResize();
  drawScene();
})();
</script>
</body>
</html>
